<g font-family="Arial, sans-serif" fill="#19232C">
<text x="48" y="52" font-size="17" fill="#276E68">PYXMINT / SYSTEMS IN PRACTICE</text>
<text x="48" y="98" font-size="32" font-weight="bold">System and disclosure boundaries</text>
<text x="48" y="132" font-size="17">DOCUMENTED DESIGN / Conceptual scope, not deployed topology</text><rect x="48" y="180" width="904" height="95" rx="10" fill="#FFFFFF" stroke="#276E68" stroke-width="2"/><text x="70" y="216" font-size="22" font-weight="bold">People in face-to-face conversation</text><text x="70" y="245" font-size="17">Human context; no participant details or real transcripts</text><path d="M500,275 L500,310" stroke="#276E68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="48" y="315" width="904" height="220" rx="12" fill="none" stroke="#276E68" stroke-width="2"/><text x="70" y="350" font-size="22" font-weight="bold">Approved browser experience</text><rect x="70" y="370" width="410" height="135" rx="10" fill="#FFFFFF" stroke="#276E68" stroke-width="2"/><text x="92" y="406" font-size="22" font-weight="bold">Conversation workflow</text><text x="92" y="435" font-size="17">Push-to-talk</text><text x="92" y="460" font-size="17">Multilingual translation</text><rect x="510" y="370" width="420" height="135" rx="10" fill="#FFFFFF" stroke="#276E68" stroke-width="2"/><text x="532" y="406" font-size="22" font-weight="bold">Supporting features</text><text x="532" y="435" font-size="17">Optional transcript</text><text x="532" y="460" font-size="17">Active-speaking allowance</text><path d="M48,575 L952,575" stroke="#19232C" stroke-width="2" stroke-dasharray="8 6"/><text x="48" y="610" font-size="21" font-weight="bold">Outside this case study</text><text x="48" y="645" font-size="18">Private source and history · Internal services and deployment · Credentials</text><text x="48" y="675" font-size="18">Storage behavior · Real conversation content · Private usage data</text><text x="48" y="735" font-size="16">This is a disclosure boundary, not a security control or network boundary.</text><text x="48" y="763" font-size="15">Farshid Ghaffari / Systems in practice</text></g></svg>
