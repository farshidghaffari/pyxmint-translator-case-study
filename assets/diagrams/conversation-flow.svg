<text x="48" y="98" font-size="32" font-weight="bold">Conversation flow</text>
<text x="48" y="132" font-size="17">DOCUMENTED DESIGN / Conceptual workflow, not product UI</text><rect x="48" y="180" width="540" height="100" rx="10" fill="#FFFFFF" stroke="#276E68" stroke-width="2"/><text x="70" y="216" font-size="22" font-weight="bold">Push-to-talk turn</text><text x="70" y="245" font-size="17">Speaker contributes a turn in the browser</text><path d="M318,280 L318,325" stroke="#276E68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="48" y="330" width="540" height="100" rx="10" fill="#FFFFFF" stroke="#276E68" stroke-width="2"/><text x="70" y="366" font-size="22" font-weight="bold">Translation function</text><text x="70" y="395" font-size="17">Multilingual face-to-face conversation</text><path d="M318,430 L318,475" stroke="#276E68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="48" y="480" width="540" height="100" rx="10" fill="#FFFFFF" stroke="#276E68" stroke-width="2"/><text x="70" y="516" font-size="22" font-weight="bold">Continue the conversation</text><text x="70" y="545" font-size="17">Participants take the next turn</text><rect x="650" y="330" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#276E68" stroke-width="2"/><text x="672" y="366" font-size="22" font-weight="bold">Optional transcript</text><text x="672" y="395" font-size="17">Feature association only</text><path d="M588,380 L650,380" stroke="#276E68" stroke-width="2" stroke-dasharray="6 5"/><rect x="650" y="180" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#276E68" stroke-width="2"/><text x="672" y="216" font-size="22" font-weight="bold">Speaking allowance</text><text x="672" y="245" font-size="17">Active-speaking allowance</text><text x="48" y="635" font-size="17">Persian · Armenian · English · German · Russian</text><text x="48" y="665" font-size="16">Language scope does not imply equal quality or all-directions validation.</text><text x="48" y="705" font-size="15">Functional abstraction only. No internal sequence, storage or recovery guarantee is depicted.</text></g></svg>
